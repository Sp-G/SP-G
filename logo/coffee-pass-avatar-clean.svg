<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#3B2418"/>
      <stop offset="1" stop-color="#1A0F0A"/>
    </radialGradient>
    <radialGradient id="coffee" cx="45%" cy="40%" r="65%">
      <stop offset="0" stop-color="#6B3F27"/>
      <stop offset=".7" stop-color="#4A2A1A"/>
      <stop offset="1" stop-color="#2E1A10"/>
    </radialGradient>
    <radialGradient id="crema" cx="50%" cy="50%" r="50%">
      <stop offset=".86" stop-color="#C9894E" stop-opacity="0"/>
      <stop offset=".97" stop-color="#C9894E" stop-opacity=".55"/>
      <stop offset="1" stop-color="#C9894E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#E39A06"/>
      <stop offset="1" stop-color="#F4B623"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <circle cx="540" cy="540" r="505" fill="none" stroke="#F5EFE6" stroke-opacity=".18" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round"/>

  <g transform="translate(540 540) scale(1.32) translate(-555 -545)">
  <!-- cup, top view -->
  <g filter="url(#shadow)">
    <!-- handle -->
    <rect x="770" y="612" width="120" height="58" rx="29" fill="#F5EFE6" transform="rotate(28 770 641)"/>
    <circle cx="540" cy="560" r="262" fill="#F5EFE6"/>
  </g>
  <circle cx="540" cy="560" r="262" fill="none" stroke="#E2D6C6" stroke-width="6"/>
  <circle cx="540" cy="560" r="222" fill="url(#coffee)"/>
  <circle cx="540" cy="560" r="222" fill="url(#crema)"/>
  <!-- latte swirl -->
  <path d="M 420 470 C 470 430, 560 440, 590 470" stroke="#C9894E" stroke-opacity=".35" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M 440 680 C 500 710, 590 700, 640 660" stroke="#C9894E" stroke-opacity=".25" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- the check: breaking out of the cup -->
  <g filter="url(#shadow)">
    <polyline points="378,548 492,662 790,388" fill="none" stroke="url(#gold)" stroke-width="104" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- "pass" on the long arm -->
  <g transform="translate(688 483) rotate(-42.6)">
    <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-family="Inter Display" font-weight="900" font-size="74" letter-spacing="2" fill="#1E120C" transform="scale(1.25 1)">pass</text>
  </g>

  </g>

  <!-- steam sparkle -->
  <g stroke="#F5EFE6" stroke-width="8" stroke-linecap="round" opacity=".9">
    <path d="M 905 205 v 44 M 883 227 h 44"/>
  </g>
  <circle cx="955" cy="170" r="7" fill="#F5EFE6" opacity=".7"/>
</svg>
